# Databricks Asset Bundle: deploys the ingestion job.
#   databricks bundle deploy -t prod            # the real, scheduled job (builds the daily history)
#   databricks bundle run dengue_ingest -t prod # runs setup -> land -> bronze once, right now
#   databricks bundle deploy -t dev             # a paused copy writing to schema dengue_dev, for experiments
bundle:
  name: upside-devs-dengue

# Only code and seed data go to the workspace; notes, slides and local downloads stay on your laptop.
sync:
  exclude:
    - HANDOFF.md
    - "*.pdf"
    - _landing

variables:
  catalog:
    description: Unity Catalog catalog to write into
    default: workspace
  schema:
    description: Schema for volumes and bronze tables
    default: dengue
  warehouse_id:
    description: SQL warehouse the dashboard runs on
    default: 18e372f3f7575204

resources:
  jobs:
    dengue_ingest:
      name: dengue-ingest-bronze
      # NEA refreshes dengue clusters around 10:00 SGT. The 11:30 run captures that
      # day's version; the 18:30 run is a backup in case the morning run fails or NEA
      # publishes late. A run only stores a new copy when NEA actually changed the data.
      schedule:
        quartz_cron_expression: "0 30 11,18 * * ?"
        timezone_id: Asia/Singapore
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: include_large
          default: "false"
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ./notebooks/00_setup.py
        - task_key: land_raw
          depends_on:
            - task_key: setup
          max_retries: 1
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: ./notebooks/01_land_raw.py
        - task_key: bronze
          depends_on:
            - task_key: land_raw
          max_retries: 1
          notebook_task:
            notebook_path: ./notebooks/02_bronze_autoloader.py
        - task_key: silver
          depends_on:
            - task_key: bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.silver.id}
        # This week's inspection sites from the newest NEA list + newest locked forecast
        - task_key: team_plan
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./notebooks/04_team_plan.py
        # The forecast made afterwards from NEA's 14 Oct list, compared with NEA's newest list
        - task_key: retro_forecast
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./notebooks/06_retro_forecast.py
        # Copy what the app shows into Lakebase
        - task_key: publish_app_data
          depends_on:
            - task_key: team_plan
            - task_key: retro_forecast
          notebook_task:
            notebook_path: ./notebooks/05_publish_app_data.py
            base_parameters:
              lakebase_instance: ${resources.database_instances.lakebase.name}

    # Trains and tests the models (MLflow), then appends a forecast for all 55 areas to the
    # append-only gold_sealed_forecasts table. Run by hand for now; refuses to lock the same
    # NEA list twice.
    dengue_lock_forecast:
      name: dengue-lock-forecast
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: git_commit
          default: ${bundle.git.commit}
        - name: allow_relock
          default: "false"
      tasks:
        - task_key: lock_forecast
          notebook_task:
            notebook_path: ./notebooks/03_lock_forecast.py
        # refresh the dashboard tables and the team plan from the new forecast
        - task_key: refresh_dashboard_tables
          depends_on:
            - task_key: lock_forecast
          pipeline_task:
            pipeline_id: ${resources.pipelines.silver.id}
        - task_key: team_plan
          depends_on:
            - task_key: refresh_dashboard_tables
          notebook_task:
            notebook_path: ./notebooks/04_team_plan.py
        - task_key: retro_forecast
          depends_on:
            - task_key: refresh_dashboard_tables
          notebook_task:
            notebook_path: ./notebooks/06_retro_forecast.py
        - task_key: publish_app_data
          depends_on:
            - task_key: team_plan
            - task_key: retro_forecast
          notebook_task:
            notebook_path: ./notebooks/05_publish_app_data.py
            base_parameters:
              lakebase_instance: ${resources.database_instances.lakebase.name}

  pipelines:
    # Lakeflow Declarative Pipeline: bronze -> one mapped cluster history (silver_* tables)
    # -> the area-by-fortnight model table (gold_*), with data-quality expectations.
    # Runs as the last step of the job above.
    silver:
      name: dengue-silver
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      libraries:
        - file:
            path: ./pipelines/silver_clusters.sql
        - file:
            path: ./pipelines/gold_area_fortnight.sql
        - file:
            path: ./pipelines/gold_dashboard.sql

  # Lakebase Postgres for the app: notebooks/05_publish_app_data.py writes schema "dengueradar"
  database_instances:
    lakebase:
      name: dengueradar
      capacity: CU_1

  apps:
    # The Monday screen with the real map (planning areas, Wolbachia zones, clusters, team sites)
    dengueradar_app:
      name: dengueradar
      description: "DengueRadar: two-week dengue risk by planning area, alerts, new-cluster watch and team planner"
      source_code_path: ./app
      resources:
        - name: lakebase
          description: Lakebase Postgres holding the app's data
          database:
            instance_name: ${resources.database_instances.lakebase.name}
            database_name: databricks_postgres
            permission: CAN_CONNECT_AND_CREATE
        - name: llm
          description: Foundation model that drafts the alerts
          serving_endpoint:
            name: databricks-meta-llama-3-3-70b-instruct
            permission: CAN_QUERY

  dashboards:
    # Analyst view: risk by area, new-cluster watch, team plan, track record, test results.
    # Built from scripts/build_dashboard.py.
    dengueradar:
      display_name: DengueRadar
      file_path: ./dashboards/dengueradar.lvdash.json
      warehouse_id: ${var.warehouse_id}

targets:
  # Development mode prefixes the job name with [dev <you>] and pauses its schedule,
  # so experiments never run on their own or touch the real history.
  dev:
    mode: development
    default: true
    variables:
      schema: dengue_dev

  # No `mode` here on purpose: development mode would pause the schedule on every deploy.
  prod:
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/prod
